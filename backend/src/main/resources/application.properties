spring.application.name=backend

# ------------------------------------------------------------------------------
# MySQL Database
# Prefer DB_URL / DB_USERNAME / DB_PASSWORD (shared or local).
# Fallbacks: SPRING_DATASOURCE_* then localhost defaults for solo local work.
# Never commit real credentials. Set env vars or a local (gitignored) .env.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/habitloop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=Swasti@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "update" adds missing columns/tables safely for hackathon iteration.
# Do not use "create" / "create-drop" — those destroy data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
